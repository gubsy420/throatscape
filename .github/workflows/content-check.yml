name: Content check

# Every pack in the repository still validates, and the game still plays.
# Runs on anything that touches the game or its content, so a hand-written
# change gets exactly the same gate as a generated one.

on:
  push:
    branches: [main]
    paths: ['content/**', 'js/**', 'server/**', 'tools/**']
  pull_request:
    paths: ['content/**', 'js/**', 'server/**', 'tools/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Every pack validates
        run: |
          if [ -n "$(ls -A content/packs 2>/dev/null)" ]; then
            node tools/validate.mjs --all
          else
            echo "no packs yet"
          fi

      - name: The world can still be drawn
        run: node tools/render3d.mjs

      - name: The game still plays
        run: node tools/smoke.mjs

      - name: The campaign can still be finished
        run: node tools/quests.mjs

      # The pipeline's own gate. It decides whether a night's delivery is
      # published or discarded, and until it had a test it was inline shell
      # nobody could run — which is how it spent a week reading a leftover
      # scratch file as an attempt to tamper with the game.
      - name: The content pipeline's guard still guards
        run: node tools/guard.mjs --self-test

      - name: The bulletin is well formed
        run: |
          node -e "
            const list = require('./content/patchnotes.json');
            if (!Array.isArray(list) || !list.length) throw new Error('no bulletins');
            for (const e of list) {
              if (!e.version || !e.date || !e.title || !Array.isArray(e.notes)) {
                throw new Error('malformed entry: ' + JSON.stringify(e).slice(0, 120));
              }
              if (!e.notes.length) throw new Error(e.version + ' says nothing');
            }
            const versions = list.map(e => e.version);
            if (new Set(versions).size !== versions.length) throw new Error('duplicate versions');
            /*
             * Newest first. The server hands the client list[0] as the latest
             * and shows the notice when it is newer than what the browser has
             * read, so an entry filed out of order is an update nobody is told
             * about — or one everybody is told about twice.
             */
            for (let i = 1; i < list.length; i++) {
              if (list[i].date > list[i - 1].date) {
                throw new Error(
                  'out of order: ' + list[i].version + ' (' + list[i].date + ') is filed under ' +
                  list[i - 1].version + ' (' + list[i - 1].date + '), so nobody would be shown it');
              }
            }
            console.log(list.length + ' bulletins, newest ' + versions[0] + ' on ' + list[0].date);
          "
