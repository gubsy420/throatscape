# Throatscape - one service, no state, no volumes.
#
#   docker compose up -d --build     start it
#   docker compose logs -f           watch who joins
#   docker compose down              stop it
#
# Change the published port with HOST_PORT, e.g.  HOST_PORT=9000 docker compose up -d

services:
  throatscape:
    build: .
    image: throatscape:latest
    container_name: throatscape
    restart: unless-stopped

    # reaps orphans and forwards signals; the server also handles SIGTERM itself
    init: true

    ports:
      - "${HOST_PORT:-8080}:8080"

    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATA_DIR: /data

    # Accounts and player saves. This is the only thing worth backing up, and
    # the only writable path in the container.
    volumes:
      - throatscape-data:/data

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  throatscape-data:
